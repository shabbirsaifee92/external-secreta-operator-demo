apiVersion: generators.external-secrets.io/v1alpha1
kind: UUID
metadata:
  name: my-uuid
  namespace: eso-demo
spec: {}
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: "uuid"
  namespace: eso-demo
spec:
  refreshInterval: "10s"
  target:
    name: uuid-secret
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: UUID
          name: "my-uuid"